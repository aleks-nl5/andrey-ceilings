<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle safe padding -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  
  <!-- Subtle Ceiling grid lines -->
  <path d="M64 160h384M64 256h384M64 352h384M160 64v384M256 64v384M352 64v384" stroke="#334155" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6,6"/>

  <!-- Room blueprint polygon (trapezoid stretch ceiling) -->
  <polygon points="120,150 392,120 412,360 100,380" fill="#1e3a8a" fill-opacity="0.35" stroke="url(#laser)" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Corner Points -->
  <circle cx="120" cy="150" r="10" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="392" cy="120" r="10" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="412" cy="360" r="10" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="100" cy="380" r="10" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Diagonal line D1 -->
  <line x1="120" y1="150" x2="412" y2="360" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8,6" opacity="0.9"/>
  <!-- Diagonal line D2 -->
  <line x1="100" y1="380" x2="392" y2="120" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8,6" opacity="0.9"/>

  <!-- Center Spotlight / Chandelier icon -->
  <circle cx="256" cy="246" r="32" fill="#0f172a" stroke="url(#accent)" stroke-width="5"/>
  <circle cx="256" cy="246" r="14" fill="#fbbf24" filter="url(#glow)"/>
  <!-- Light rays -->
  <line x1="256" y1="198" x2="256" y2="208" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="284" x2="256" y2="294" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="208" y1="246" x2="218" y2="246" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="294" y1="246" x2="304" y2="246" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

  <!-- Tape measure / Laser icon badge at bottom-right -->
  <g transform="translate(320, 310)">
    <rect width="130" height="42" rx="10" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="65" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">ПОТОЛОК</text>
  </g>
</svg>
